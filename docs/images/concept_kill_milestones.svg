<svg xmlns='http://www.w3.org/2000/svg' width='900' height='380' viewBox='0 0 900 380' role='img' aria-label='Kill milestones'><rect width='900' height='380' rx='14' fill='#15131a'/><rect x='16' y='16' width='868' height='348' rx='12' fill='#1d1a24' stroke='#3a3445'/><text x='450.0' y='48.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='16' fill='#ece8f4' text-anchor='middle' font-weight='bold'>The blade grows with every life it takes</text><defs><linearGradient id='g' x1='0' x2='1'><stop offset='0' stop-color='#3b2557'/><stop offset='1' stop-color='#b06cff'/></linearGradient></defs><rect x='130' y='141' width='650' height='18' rx='9' fill='url(#g)'/><circle cx='140.0' cy='150' r='9' fill='#d9a93a' stroke='#15131a' stroke-width='3'/><text x='140.0' y='88.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#d9a93a' text-anchor='middle' font-weight='bold'>8 kills</text><text x='140.0' y='106.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#ece8f4' text-anchor='middle' font-weight='normal'>Claimed at The Frozen Eye</text><text x='140.0' y='123.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#a7a1b5' text-anchor='middle' font-weight='normal'>(8 offered lives)</text><circle cx='255.0' cy='150' r='9' fill='#d9a93a' stroke='#15131a' stroke-width='3'/><text x='255.0' y='184.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#d9a93a' text-anchor='middle' font-weight='bold'>100 kills</text><text x='255.0' y='202.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#ece8f4' text-anchor='middle' font-weight='normal'>The Devourer</text><text x='255.0' y='219.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#a7a1b5' text-anchor='middle' font-weight='normal'>Soul Arrow + Black Skull I</text><circle cx='380.0' cy='150' r='9' fill='#d9a93a' stroke='#15131a' stroke-width='3'/><text x='380.0' y='88.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#d9a93a' text-anchor='middle' font-weight='bold'>200 kills</text><text x='380.0' y='106.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#ece8f4' text-anchor='middle' font-weight='normal'>Black Skull II</text><circle cx='567.5' cy='150' r='9' fill='#d9a93a' stroke='#15131a' stroke-width='3'/><text x='567.5' y='184.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#d9a93a' text-anchor='middle' font-weight='bold'>350 kills</text><text x='567.5' y='202.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#ece8f4' text-anchor='middle' font-weight='normal'>Champion chance</text><text x='567.5' y='219.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#a7a1b5' text-anchor='middle' font-weight='normal'>caps at +35%</text><circle cx='755.0' cy='150' r='9' fill='#d9a93a' stroke='#15131a' stroke-width='3'/><text x='755.0' y='88.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#d9a93a' text-anchor='middle' font-weight='bold'>500 kills</text><text x='755.0' y='106.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#ece8f4' text-anchor='middle' font-weight='normal'>Gorged form</text><text x='755.0' y='123.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#a7a1b5' text-anchor='middle' font-weight='normal'>Black Skull III, new look</text><text x='60.0' y='262.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#b48cf0' text-anchor='start' font-weight='bold'>Damage</text><text x='190.0' y='262.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#ece8f4' text-anchor='start' font-weight='normal'>+1% for every 10 kills, no cap</text><text x='560.0' y='262.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#a7a1b5' text-anchor='start' font-weight='normal'>(500 kills: +50%)</text><text x='60.0' y='286.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#b48cf0' text-anchor='start' font-weight='bold'>Champions</text><text x='190.0' y='286.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#ece8f4' text-anchor='start' font-weight='normal'>+2% chance per enemy for every 20 kills</text><text x='560.0' y='286.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#a7a1b5' text-anchor='start' font-weight='normal'>(max +35%)</text><text x='60.0' y='310.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#b48cf0' text-anchor='start' font-weight='bold'>Chaos Armor</text><text x='190.0' y='310.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#ece8f4' text-anchor='start' font-weight='normal'>+1 Melee and Ranged Defense per +1% damage</text><text x='560.0' y='310.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#a7a1b5' text-anchor='start' font-weight='normal'>(perk, no cap)</text><text x='60.0' y='334.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#b48cf0' text-anchor='start' font-weight='bold'>Black Skull</text><text x='190.0' y='334.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#ece8f4' text-anchor='start' font-weight='normal'>+0.1 / 0.25 / 0.5 max fatigue per +1% damage</text><text x='560.0' y='334.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#a7a1b5' text-anchor='start' font-weight='normal'>(after part I / II / III)</text></svg>